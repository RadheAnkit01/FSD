<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <label for="price">Price</label>
    <input id="price" type="number" name="" placeholder="Total Price"><br>
    <label for="tax">Tax</label>
    <input id="tax" type="number" name="" placeholder="Tax %"><br>
    <label for="discount">Discount</label>
    <input id="discount" type="number" name="" placeholder="Discount %"><br>
    <button onclick="calculatePrice()">Calculate Price</button>
    <h1 id="output"></h1>
    <script>
        //impure function
        function calculatePrice() {
            let price = document.getElementById("price").value
            let tax = document.getElementById("tax").value
            // let discount = document.getElementById("discount").value //--> direct way
            let discountBox = document.getElementById("discount") //indirect way
            let discount = discountBox.value
            let output = document.getElementById("output")

            let finalPrice = calculateFinalPrice(price, tax, discount)
            // output.innerText = `Your Final Price is = ${finalPrice}`
            output.innerText = "Your Final Price is = " + finalPrice
        }
        //pure function
        function calculateFinalPrice(price, tax, discount) {
            let priceAfterDiscount = price - (price * discount / 100)
            return priceAfterDiscount + (price * tax / 100)
        }

    </script>
</body>

</html>
