        //method 1 by async await 
        async function getResult() {
            let req = await fetch("script1.js")
            if (req.status != 200) {
                throw "error"
            }
            let data = await req.text();
            return data;
        }
        async function getResult2() {
            let promise = new Promise((resolve, reject) => {
                let num = 4;
                if (num % 2 == 0) {
                    resolve("Even")
                } else {
                    reject("Odd")
                }
            })

            let res = await promise;
            return res;
        }
