<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <ul id="list"></ul>
    <script>
        let req = new XMLHttpRequest()
        req.open("GET", "data.json", true) // prepare data to send request.
        req.send() // this is actually send request to the server.

        //to convert data into json or other.
        req.responseType = 'json';
        //
        req.onload = function () {

            for (let user of req.response) {
                let li = document.createElement("li")
                li.innerText = user.name;
                list.append(li)
            }
        }



    </script>
</body>

</html>
