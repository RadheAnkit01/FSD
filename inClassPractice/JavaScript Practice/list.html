<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ol{

        }
        ol li {

</head>
<body>
    <ol>

            },
        ];
        
        let ol = document.querySelector("ol")
        for(let i=0; i<list.length;i++){
            let oli = document.createElement("li")

                ol.appendChild(ul)
            }
        }
