<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ol></ol>

    <script>
        let pswd
        let triesAllow= 3
        let userTries =0

        while(pswd != "123" && userTries<triesAllow){
            pswd = prompt("Enter the password, Only 3 tries allowed!")
            if(pswd =="123"){
                alert("Access Granted")
                break
            }
            else{
                userTries++
                alert("Access Denied, (" + (triesAllow-userTries) + ") Remaining Tries")
            }
        }
    </script>
</body>
