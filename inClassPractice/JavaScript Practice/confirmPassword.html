<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/BootstrapIcon/node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        .chkpass{
            background-color: antiquewhite;
            margin: 40px;
            padding: 40px;
            width: 40vw;
        }
        
    </style>
</head>
<body>
    <div class="chkpass">
        <h1 style="text-align: center;">Password</h1>
        <label for="">Password</label>
        <input type="password" id="pass1" onkeyup="checkLen(),chkPswd()">
        <p style="display: inline; font-size: 9px;">Remaining Length </p>
        <p style="display: inline; font-size: 9px;" id="len">20</p>
        <br><br>
        <label for="">Confirm Password</label>
        <input type="password" id="pass2" onkeyup="chkPswd()">
        <button class="eyebtn" onclick="onClickEye()" id="eyebtn"><i class="bi bi-eye-slash-fill" id="eye"></i></button>
        <p id="op" style="color: red;">Password Not Matched!</p>
    </div>

    <script>
        function chkPswd(){
            let pass1 = document.getElementById("pass1")
            let pass2 = document.getElementById("pass2")
            let op =  document.getElementById("op")
            op.innerText = (pass1.value === pass2.value)? "Password Matched!" : "Password Not Matched!"
            if(op.innerText=== "Password Matched!"){
                op.style.color = "green"
            }else{
                op.style.color = "red"
            }
        }
        function checkLen(){
            let maxChar = 20;
            userLen = document.getElementById("pass1").value
            console.log(maxChar-userLen.length)
            document.getElementById("len").innerText= Number(maxChar-userLen.length)
        }
        function onClickEye(){
            const password = document.getElementById("pass2")
            const eye = document.getElementById("eye")

            if(password.type === "password"){
                password.type = "text"
                eye.className = "bi bi-eye-fill"
            }else {
                password.type = "password"
                eye.className = "bi bi-eye-slash-fill"
            }
        }
    </script>
</body>
</html>
