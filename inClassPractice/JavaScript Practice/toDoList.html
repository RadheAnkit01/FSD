        var taskSpace = document.getElementById("taskSpace")
        var count = 0;

        function createTask() {
            var inputText = document.getElementById("inputCreateTask").value

            var taskDetails = { taskNumber: ++count, taskText: inputText }

            addTask(taskDetails)

        }
        function addTask(details) {

            var newTaskSpace = document.createElement("div")
            newTaskSpace.setAttribute("id", `task${details.taskNumber}`)
            newTaskSpace.setAttribute("class", `task task${details.taskNumber}`)

            var taskNumberSpace = document.createElement("p")
            taskNumberSpace.innerText = details["taskNumber"];


            var taskTextSpace = document.createElement("p")
            taskTextSpace.innerText = details["taskText"];

            newTaskSpace.append(taskNumberSpace, taskTextSpace)
            taskSpace.appendChild(newTaskSpace)
