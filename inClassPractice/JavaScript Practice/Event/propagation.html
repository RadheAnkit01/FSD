<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .div {
            border: 1px solid black;
            text-align: center;
            font-size: 2rem;
            /* text-align: center; */
            /* display: flex;
            justify-content: center; */
        }

        .div-1 {
            width: 80vw;
            height: 80vh;
        }

        .div-2 {
            width: 60vw;
            height: 60vh;
        }

        .div-3 {
            width: 40vw;
            height: 40vh;
        }

        .div-4 {
            width: 20vw;
            height: 20vh;
        }
    </style>
</head>

<body>
    <div class="div div-1" id="box1">
        <div class="div div-2" id="box2">
            <div class="div div-3" id="box3">
                <div class="div div-4" id="box4">Innermost Box <br> (here propagation is off)</div>Inner box
            </div>
            outer box
        </div>
        outermost box
    </div>

    <script>
        document.getElementById("box1").addEventListener("click", function (e) {
            alert("Outermost Box triggered")

        }, false)
        document.getElementById("box2").addEventListener("click", function (e) {
            alert("Outer Box triggered")
        }, false)
        document.getElementById("box3").addEventListener("click", function (e) {
            alert("Inner Box triggered")
        }, false)
        document.getElementById("box4").addEventListener("click", function (e) {
            alert("Innermost Box triggered")
            e.stopPropagation()
        }, false)
    </script>
</body>

</html>
