    <h1> Index Database</h1>

    <script>

        function createDB(dbname, version) {
            let request = indexedDB.open(dbname, version)
            return request;
            // request.onsuccess = function (event) {
            //     let db = event.target.result
            // }
        }


        function getTable(tableName, primaryKey) {
            let db = createDB("schoolDB", 1)
            //onupgradeneeded event will be triggered when we are creating the database for the first time or when we are upgrading the database version
            db.onupgradeneeded = function (event) {
                let db = event.target.result
                //it will give us the database instance which is being created or upgraded

                db.createObjectStore(tableName, {
                    keyPath: primaryKey
                })
            }
        }
