<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        div{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
        }
        h1{
            border: 1px solid black;
            margin: 15px;
            text-align: center;
            /* align-items: center; */
            /* align-self: center; */
            align-content: center;
        }
        .h1_1{
            grid-row:1/3;

        }
        .h1_2{
            grid-column:2/4;

        }
        .h1_3{
            grid-column:2/4;

        }
        .h1_10{
            grid-column:1/4;

        }
        .h1_13{
            grid-row:6/9;
            /* grid-row-start: 6;
            grid-row-end: 9; */
            grid-column:3/4;
            /* grid-column-start: 3;
            grid-column-end: 4; */
        }
        </style>
</head>
<body>
    <div>
        <h1 class="h1_1">Heading 1</h1>
        <h1 class="h1_2">Heading 2</h1>
        <h1 class="h1_3">Heading 3</h1>
        <h1 class="h1_4">Heading 4</h1>
        <h1 class="h1_5">Heading 5</h1>
        <h1 class="h1_6">Heading 6</h1>
        <h1 class="h1_7">Heading 7</h1>
        <h1 class="h1_8">Heading 8</h1>
        <h1 class="h1_9">Heading 9</h1>
        <h1 class="h1_10">Heading 10</h1>
        <h1 class="h1_11">Heading 11</h1>
        <h1 class="h1_12">Heading 12</h1>
        <h1 class="h1_13">Heading 13</h1>
        <h1 class="h1_14">Heading 14</h1>
        <h1 class="h1_15">Heading 15</h1>
        <h1 class="h1_16">Heading 16</h1>
    </div>
</body>
</html>
