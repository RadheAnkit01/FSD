<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            color: var(--ptxtcolor);

        }

        :root {
            --pbgcolor: red;
            --sbgcolor: rgb(248, 136, 136);
            --bgcolor1: rgba(245, 88, 88, 0.545);
            --ptxtcolor: rgb(0, 0, 0);
            --stxtcolor: rgb(0, 100, 133);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--pbgcolor);
            gap: 30px;
            height: 40px;
            padding: 10px;
        }

        a {
            font-size: 22px;
            text-decoration: none;
            margin: 0px 15px;
            /* font-weight: ; */
        }

        .logo {
            font-size: 25px;
            margin: 0px 15px;

        }

        body {
            background-color: var(--sbgcolor);
        }

        .parent-1 {
            height: auto;
            width: auto;
            background-color: var(--bgcolor1);
            border-radius: 20px;
            margin: 10px;
            padding: 20px 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: space-evenly;
            align-items: center;
        }

        .parent-2 {
            height: 600px;
            width: auto;
            border-radius: 20px;
            margin: 10px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            background-color: var(--bgcolor1);
        }

        .box {
            height: 400px;
            width: 400px;
            border: 1px solid black;
            border-radius: 20px;
        }

        .box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
        }

        .box-1 {
            background-color: rgba(240, 248, 255, 0.595);
        }

        .box-2 {
            background-color: rgba(85, 224, 248, 0.595);
        }

        .box-3 {
            width: 80vw;
            height: 500px;
            border: 2px solid black;
            border-radius: 100px;
            align-content: center;
            text-align: center;
            font-size: 30px;
            background-color: rgba(97, 255, 255, 0.617);
        }

        footer {
            /* height: 200px; */
            background-color: var(--pbgcolor);
            padding: 10px 10px 0px 10px;
        }

        .fbox1 {
            height: auto;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }

        .fbox2 {
            height: 40px;
            align-content: center;
            text-align: center;
            border-top: 1px solid black;
        }

        .floating {
            height: 100px;
            width: 100px;
            position: fixed;
            bottom: 20px;
            right: 20px;
            border-radius: 50%;
            overflow: hidden;
        }

        .floating img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.3);
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">
            <h1>Logo</h1>
        </div>
        <div class="links">
            <a href="#">Home</a>
            <a href="#">Collections</a>
            <a href="#">Library</a>
            <a href="#">Contacts</a>
            <a href="#">Join</a>
            <a href="#">Profile</a>
        </div>
    </header>

    <div class="parent parent-1">
        <div class="box box-1">
            <img src="/OJT/Public/img/goa.webp" alt="">
        </div>
        <div class="box box-2">
            <img src="/OJT/Public/img/mumbai.jpg" alt="">

        </div>
    </div>
    <div class="parent parent-2">
        <div class="box-3">
            <h1>
                Welcome to this website where we learn something, Thanks for visiting us.
            </h1>
        </div>
    </div>

    <div class="floating">
        <img src="/OJT/Public/gifs/bot.gif" alt="heart_grain_rotating" width="100px" height="100px">
    </div>

    <footer>
        <div class="fbox1">
            <div>
                <img src="/OJT/Public/img/India_Flag.webp" alt="Indian Tricolor Flag" height="140">

            </div>
            <div>
                <h3>Quick Links</h3>

            </div>
            <div>
                <h3>Follow Us</h3>

            </div>
            <div>
                <h3>Contact Us</h3>

            </div>

        </div>
        <div class="fbox2">
            All right reserved to @Ankit Raj from (2000-2026)
        </div>
    </footer>
</body>

</html>
