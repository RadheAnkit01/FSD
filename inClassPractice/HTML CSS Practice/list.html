<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list</title>
    <style>
        
        li{
            list-style: devanagari;
            list-style-position: inside;
            background-color: rgb(244, 255, 34);
            border: 2px solid black;
            list-style-type:  "❤️ ";
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>Men</li>
            <li>Women</li>
            <li>Category</li>
        </ul>
    </nav>
</body>
</html>
